name: Update Profile Animations

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

  # Run automatically whenever you push to main
  push:
    branches:
      - main

jobs:
  build-and-deploy-assets:
    name: Build & Deploy Snake Assets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Render Contribution Grid Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: raghava017
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish Artifacts to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
